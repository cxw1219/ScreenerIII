# Prometheus Configuration for ScreenerIII
# This file configures Prometheus to scrape metrics from ScreenerIII

global:
  # How often to scrape targets by default
  scrape_interval: 15s

  # How long until a scrape request times out
  scrape_timeout: 10s

  # How often to evaluate rules
  evaluation_interval: 15s

  # Attach labels to all time series collected
  external_labels:
    monitor: 'screener-iii'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    # - static_configs:
    #     - targets:
    #         - 'localhost:9093'

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"
  # - "recording_rules.yml"

# Scrape configurations
scrape_configs:
  # ScreenerIII Application Metrics
  - job_name: 'screener-iii'
    # Override the global default scrape interval (15s) to 10s for real-time updates
    scrape_interval: 10s
    scrape_timeout: 5s

    # HTTP metrics path defaults to '/metrics'
    metrics_path: '/metrics'

    # Scheme defaults to 'http'.
    scheme: http

    static_configs:
      # ScreenerIII metrics endpoint
      - targets: ['localhost:8000']
        labels:
          instance: 'screener-iii-main'

  # ScreenerIII Health Check Endpoint
  - job_name: 'screener-iii-health'
    scrape_interval: 30s
    metrics_path: '/health'
    scheme: http
    static_configs:
      - targets: ['localhost:8000']
        labels:
          instance: 'screener-iii-health'

  # Optional: Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus-main'

