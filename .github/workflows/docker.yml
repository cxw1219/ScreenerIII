name: Docker Build and Test

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image for testing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: screeneriii:test

  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: screener_test_db
          POSTGRES_USER: screener_user
          POSTGRES_PASSWORD: screener_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image for testing
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: screeneriii:test

      - name: Test Docker image build
        run: |
          docker image ls screeneriii:test
          echo "Docker image successfully built"

      - name: Start services with docker-compose
        run: |
          docker-compose -f docker-compose.yml config
          # Use profiles to only start required services
          docker-compose up -d timescaledb
          sleep 10

      - name: Check PostgreSQL service is healthy
        run: |
          for i in {1..30}; do
            docker exec screeneriii-timescaledb pg_isready -U screener_user -d screener_db && break
            sleep 1
          done
          docker exec screeneriii-timescaledb psql -U screener_user -d screener_db -c "SELECT version();"

      - name: Run basic container tests
        run: |
          echo "Testing Docker image..."
          docker run --rm screeneriii:test python --version
          docker run --rm screeneriii:test python -c "import sys; print('Python environment OK')"

      - name: Test database connection from container
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL="postgresql://screener_user:screener_password@localhost:5432/screener_db" \
            screeneriii:test \
            python -c "import psycopg2; conn = psycopg2.connect('postgresql://screener_user:screener_password@localhost:5432/screener_db'); print('Database connection OK'); conn.close()"

      - name: Check image metadata
        run: |
          docker image inspect screeneriii:test | jq '.[0].Config.Labels'

      - name: Cleanup
        if: always()
        run: |
          docker-compose down -v || true
          docker rmi screeneriii:test || true

  docker-compose:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: screeneriii:test

      - name: Validate docker-compose.yml
        run: |
          docker-compose config > /dev/null
          echo "docker-compose.yml is valid"

      - name: Test docker-compose up
        run: |
          docker-compose -f docker-compose.yml build
          timeout 60 docker-compose up -d timescaledb || true
          sleep 5
          docker ps -a

      - name: Check service logs
        if: always()
        run: |
          docker-compose logs timescaledb || true

      - name: Cleanup
        if: always()
        run: |
          docker-compose down -v || true

  push-to-registry:
    runs-on: ubuntu-latest
    needs: [ build, test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to registry
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
