name: Documentation Checks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs.yml'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    name: Markdown Linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          markdownlint '**/*.md' --ignore 'node_modules' || true
        continue-on-error: true

      - name: Install markdown-cli
        run: npm install -g markdown-cli

      - name: Validate markdown syntax
        run: |
          for file in *.md docs/**/*.md; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              markdown "$file" > /dev/null || echo "Warning: $file has syntax issues"
            fi
          done || true
        continue-on-error: true

  link-check:
    runs-on: ubuntu-latest
    name: Check for Broken Links

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check markdown links
        run: |
          find . -name '*.md' -type f | while read file; do
            echo "Checking links in: $file"
            markdown-link-check "$file" --timeout 10000 || true
          done
        continue-on-error: true

      - name: Run Python link checker
        run: |
          pip install requests beautifulsoup4
          python -c "
          import os
          import re
          import requests
          from urllib.parse import urlparse

          # Find all markdown files
          markdown_files = []
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.md'):
                      markdown_files.append(os.path.join(root, file))

          # Extract and check HTTP(S) links
          url_pattern = r'https?://[^\s\)]+\b'
          checked_urls = set()

          for file in markdown_files:
              with open(file, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
                  urls = set(re.findall(url_pattern, content))
                  for url in urls:
                      if url not in checked_urls:
                          checked_urls.add(url)
                          try:
                              response = requests.head(url, timeout=5, allow_redirects=True)
                              status = response.status_code
                              if status >= 400:
                                  print(f'Broken link ({status}): {url} in {file}')
                          except Exception as e:
                              print(f'Could not check: {url} - {str(e)[:50]}')
          " || true
        continue-on-error: true

  docstring-check:
    runs-on: ubuntu-latest
    name: Python Docstring Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pydocstyle
        run: pip install pydocstyle

      - name: Check docstrings
        run: |
          pydocstyle src/ main.py || true
        continue-on-error: true

  readme-completeness:
    runs-on: ubuntu-latest
    name: README Completeness Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README.md exists
        run: |
          if [ -f "README.md" ]; then
            echo "README.md found"
            wc -l README.md
          else
            echo "ERROR: README.md not found"
            exit 1
          fi

      - name: Verify README contains key sections
        run: |
          required_sections=("Installation" "Usage" "Configuration" "Contributing")
          missing_sections=()

          for section in "${required_sections[@]}"; do
            if ! grep -q "## $section" README.md; then
              missing_sections+=("$section")
            fi
          done

          if [ ${#missing_sections[@]} -gt 0 ]; then
            echo "WARNING: README missing sections: ${missing_sections[*]}"
          else
            echo "README contains all required sections"
          fi
        continue-on-error: true

  docs-build:
    runs-on: ubuntu-latest
    name: Documentation Build Test
    if: hashFiles('docs/') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install documentation tools
        run: |
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints || true
        continue-on-error: true

      - name: Build documentation
        run: |
          if [ -d "docs" ] && [ -f "docs/conf.py" ]; then
            cd docs
            make html || echo "Documentation build completed with warnings"
          else
            echo "No Sphinx documentation configuration found"
          fi
        continue-on-error: true

      - name: Upload documentation artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: documentation
          path: docs/_build/html/
        continue-on-error: true

  docs-summary:
    runs-on: ubuntu-latest
    needs: [ markdown-lint, link-check, docstring-check, readme-completeness ]
    if: always()

    steps:
      - name: Documentation Check Summary
        run: |
          echo "Documentation checks completed!"
          echo "Markdown linting: ${{ needs.markdown-lint.result }}"
          echo "Link checking: ${{ needs.link-check.result }}"
          echo "Docstring check: ${{ needs.docstring-check.result }}"
          echo "README completeness: ${{ needs.readme-completeness.result }}"
