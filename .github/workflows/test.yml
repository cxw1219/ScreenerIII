name: Comprehensive Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short --junit-xml=junit-unit.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: junit-unit-py${{ matrix.python-version }}
          path: junit-unit.xml

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: screener_test_db
          POSTGRES_USER: screener_user
          POSTGRES_PASSWORD: screener_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL to be ready
        run: |
          apt-get update
          apt-get install -y postgresql-client
          for i in {1..30}; do
            pg_isready -h localhost -U screener_user -d screener_test_db && break
            sleep 1
          done

      - name: Run integration tests
        run: |
          pytest tests/integration -v --tb=short --junit-xml=junit-integration.xml
        env:
          DATABASE_URL: postgresql://screener_user:screener_password@localhost:5432/screener_test_db

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: junit-integration
          path: junit-integration.xml

  coverage-report:
    runs-on: ubuntu-latest
    needs: [ unit-tests, integration-tests ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Generate coverage report
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing -v

      - name: Check coverage threshold (80%)
        run: |
          coverage_report=$(pytest tests/ --cov=src --cov-report=term-missing 2>&1 | grep TOTAL)
          coverage_percent=$(echo $coverage_report | awk '{print $NF}' | sed 's/%//')
          echo "Coverage: $coverage_percent%"
          if (( $(echo "$coverage_percent < 80" | bc -l) )); then
            echo "ERROR: Coverage is below 80% threshold: $coverage_percent%"
            exit 1
          fi
          echo "SUCCESS: Coverage meets 80% threshold: $coverage_percent%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: false

      - name: Archive coverage HTML report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-html-report
          path: htmlcov/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70

  test-summary:
    runs-on: ubuntu-latest
    needs: [ unit-tests, integration-tests, coverage-report ]
    if: always()

    steps:
      - name: Test Summary
        run: |
          echo "All tests completed!"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"
          echo "Coverage report: ${{ needs.coverage-report.result }}"
