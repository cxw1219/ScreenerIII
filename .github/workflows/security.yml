name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  bandit-scan:
    runs-on: ubuntu-latest
    name: Bandit Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        id: bandit
        run: |
          bandit -r src/ main.py setup.py -ll -f json -o bandit-report.json || true
          bandit -r src/ main.py setup.py -ll -f txt
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Comment on PR with security findings
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json
          try:
              with open('bandit-report.json', 'r') as f:
                  report = json.load(f)
              if report['results']:
                  print("Security issues found by Bandit:")
                  for result in report['results']:
                      print(f"- {result['issue_severity']}: {result['issue_text']} ({result['test_id']})")
          except:
              print("No security issues found")
          EOF

  pip-audit:
    runs-on: ubuntu-latest
    name: Pip Audit - Dependency Vulnerabilities

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pip-audit
        id: audit
        run: |
          pip-audit --desc || true
        continue-on-error: true

      - name: Save pip-audit report
        run: |
          pip-audit --desc --format json > pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v3
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  detect-secrets:
    runs-on: ubuntu-latest
    name: Detect Secrets Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets scan
        id: detect_secrets
        run: |
          detect-secrets scan --all-files --force-use-all-plugins > secrets-report.json 2>&1 || true
          # Display summary
          python -c "import json; data = json.load(open('secrets-report.json')); print(f'Found {len(data.get(\"results\", {}))} files with potential secrets')" || true
        continue-on-error: true

      - name: Upload secrets report
        uses: actions/upload-artifact@v3
        with:
          name: detect-secrets-report
          path: secrets-report.json

  create-security-issue:
    runs-on: ubuntu-latest
    needs: [ bandit-scan, pip-audit, detect-secrets ]
    if: failure() && github.event_name == 'schedule'
    name: Create Security Issue

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Issue for security findings
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security Scan - Potential Issues Found',
              body: `## Security Scan Report

The weekly security scan has found potential issues. Please review:

- Check the bandit security scan report for code security issues
- Review pip-audit report for dependency vulnerabilities
- Check detect-secrets report for exposed secrets

See the detailed reports in the artifacts of the failed workflow run.

**Link to workflow run:** ${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security', 'automated']
            });

  security-summary:
    runs-on: ubuntu-latest
    needs: [ bandit-scan, pip-audit, detect-secrets ]
    if: always()

    steps:
      - name: Security Scan Summary
        run: |
          echo "Security scanning completed!"
          echo "Bandit scan: ${{ needs.bandit-scan.result }}"
          echo "Pip audit: ${{ needs.pip-audit.result }}"
          echo "Detect secrets: ${{ needs.detect-secrets.result }}"
