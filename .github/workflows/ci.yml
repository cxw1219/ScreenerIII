name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check code formatting with black
        run: black --check --verbose src/ tests/ main.py setup.py
        continue-on-error: false

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ main.py setup.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 src/ tests/ main.py setup.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: false

      - name: Type check with mypy
        run: |
          mypy src/ tests/ main.py --ignore-missing-imports --no-error-summary 2>&1 | head -100 || true
        continue-on-error: true

      - name: Security scan with bandit
        run: |
          bandit -r src/ main.py -ll -f json -o bandit-report.json || true
          bandit -r src/ main.py -ll -f txt
        continue-on-error: true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report-py${{ matrix.python-version }}
          path: bandit-report.json

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/

  code-quality:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pylint (optional quality checks)
        run: |
          pip install pylint
          pylint src/ main.py --exit-zero --max-line-length=127 2>&1 | head -50 || true
        continue-on-error: true

      - name: Check test coverage threshold
        run: |
          coverage_report=$(pytest tests/ --cov=src --cov-report=term-missing 2>&1 | grep TOTAL)
          coverage_percent=$(echo $coverage_report | awk '{print $NF}' | sed 's/%//')
          if (( $(echo "$coverage_percent < 80" | bc -l) )); then
            echo "Coverage is below 80%: $coverage_percent%"
            exit 1
          fi
          echo "Coverage check passed: $coverage_percent%"
        continue-on-error: false
