[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scremeriii"
version = "1.0.0"
description = "Advanced stock screening and portfolio management application"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "ScreenerIII Team"},
]
keywords = ["stock-screening", "portfolio", "trading", "timescaledb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

[tool.black]
# Black code formatter configuration
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.isort]
# isort import sorting configuration
profile = "black"
line_length = 100
py_version = 39
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = 4
skip_glob = ["*/migrations/*", "*/__pycache__/*"]
known_first_party = ["screeneriii", "app", "core", "models", "api", "utils"]
known_third_party = [
    "sqlalchemy",
    "pydantic",
    "fastapi",
    "starlette",
    "psycopg2",
    "requests",
    "pandas",
    "numpy",
    "pytest",
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

[tool.mypy]
# MyPy static type checking configuration
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_any_unimported = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_incomplete_stub = true

# Ignore missing imports from untyped libraries
ignore_missing_imports = true

# Per-module options
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "conftest",
]
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "psycopg2.*",
    "sqlalchemy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short -v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
# Coverage configuration
branch = true
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__main__.py",
]

[tool.coverage.report]
# Coverage report configuration
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
# Bandit security configuration
tests = ["B201", "B301", "B302", "B303", "B304", "B305", "B306"]
skips = []
exclude_dirs = [".tox", ".venv", "venv", ".git"]
recursive = true

[tool.pylint."MESSAGES CONTROL"]
# Pylint configuration (continued in .pylintrc)
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
]
